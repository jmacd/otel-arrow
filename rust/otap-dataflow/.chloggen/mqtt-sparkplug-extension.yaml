subtext: |
  Phase 1 scope is single core, single listener, no TLS, retained STATE only, graceful OFFLINE instead of crash-safe Will, and raw mqtt_ingress relay only. It targets the standalone role of jmacd/opentelemetry-mqtt-sparkplug.
