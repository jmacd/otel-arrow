<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="876" viewBox="0 0 1240 876" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <style>
      .title { font-weight:700; font-size:21px; fill:#1f2733; }
      .sub   { font-weight:400; font-size:13px; fill:#5b6470; }
      .band  { font-weight:700; font-size:14px; }
      .stage { font-weight:700; font-size:13px; fill:#1f2733; }
      .body  { font-weight:400; font-size:12px; fill:#3a4250; }
      .small { font-weight:400; font-size:11px; fill:#5b6470; }
      .tiny  { font-weight:400; font-size:10px; fill:#6b7482; }
      .ital  { font-style:italic; font-weight:400; font-size:11px; fill:#5b6470; }
      .mono  { font-family:Consolas,'SF Mono',Menlo,monospace; font-size:11px; fill:#3a4250; }
      .monob { font-family:Consolas,'SF Mono',Menlo,monospace; font-size:11px; font-weight:700; fill:#1f2733; }
      .monot { font-family:Consolas,'SF Mono',Menlo,monospace; font-size:10px; fill:#5b6470; }
      .num   { font-weight:700; font-size:12px; fill:#ffffff; }
    </style>
    <marker id="mFlow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#2d3748"/></marker>
    <marker id="mReg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#6b3fa0"/></marker>
    <marker id="mRead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#b25f19"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="876" fill="#ffffff"/>

  <text class="title" x="28" y="34">Tenant tokens: one compiled registry, one packed context, many consumers</text>
  <text class="sub" x="28" y="54">Names and string comparisons live at startup. A request carries positional bytes; every downstream decision is a fixed-cost lookup.</text>

  <!-- ============ BAND 1: COMPILE ============ -->
  <rect x="28" y="66" width="1184" height="182" rx="8" fill="#f5f2fa" stroke="#cfc4e6"/>
  <circle cx="46" cy="88" r="11" fill="#6b3fa0"/>
  <text class="num" x="46" y="92" text-anchor="middle">1</text>
  <text class="band" x="66" y="92" fill="#6b3fa0">COMPILE</text>
  <text class="small" x="140" y="92">startup, once per configuration -- the controller builds the registry before any node starts</text>

  <rect x="45" y="102" width="336" height="62" rx="6" fill="#ffffff" stroke="#b9a8dc"/>
  <text class="stage" x="57" y="120">engine.tenant_tokens</text>
  <text class="tiny" x="200" y="120">engine scope, no per-node override</text>
  <text class="mono" x="57" y="138">edge_tenant: tenant_id  &lt;- x-tenant-id  (retain)</text>
  <text class="mono" x="57" y="154">             project_id &lt;- x-project-id</text>

  <rect x="45" y="174" width="336" height="62" rx="6" fill="#ffffff" stroke="#b9a8dc"/>
  <text class="stage" x="57" y="192">node configs</text>
  <text class="monot" x="152" y="192">tenant_routing / tenant_context</text>
  <text class="mono" x="57" y="210">the controller walks every node in the group,</text>
  <text class="mono" x="57" y="226">collecting conditions without knowing node types</text>

  <path d="M381,133 L406,133 L406,167" stroke="#6b3fa0" stroke-width="1.6" fill="none"/>
  <path d="M381,205 L406,205 L406,171 L432,171" stroke="#6b3fa0" stroke-width="1.6" fill="none" marker-end="url(#mReg)"/>

  <rect x="446" y="102" width="754" height="134" rx="6" fill="#ffffff" stroke="#8a5cc0" stroke-width="1.6"/>
  <text class="stage" x="460" y="122">Tenant token registry</text>
  <text class="tiny" x="600" y="122">shared, immutable, one per pipeline group</text>
  <text class="mono" x="460" y="146">key name    -&gt; KeyId</text>
  <text class="mono" x="460" y="164">value       -&gt; Symbol</text>
  <text class="mono" x="460" y="182">token       -&gt; key_mask</text>
  <text class="monot" x="640" y="146">interned once</text>
  <text class="monot" x="640" y="164">dense, per key</text>
  <text class="monot" x="640" y="182">one bit per extractor</text>
  <text class="mono" x="830" y="146">condition   -&gt; Signature -&gt; PairSlot</text>
  <text class="mono" x="830" y="164">retained    -&gt; value slot</text>
  <text class="mono" x="830" y="182">slot layout -&gt; epoch</text>
  <text class="monot" x="1020" y="164">a position</text>
  <text class="monot" x="1020" y="182">a generation</text>
  <rect x="460" y="192" width="726" height="34" rx="4" fill="#f2edf9"/>
  <text class="ital" x="470" y="207" fill="#5a3a86">Every string comparison happens here, once. A condition naming a key or value that was never declared</text>
  <text class="ital" x="470" y="221" fill="#5a3a86">fails the configuration now, rather than matching nothing later.</text>

  <path d="M823,236 L823,262 L700,262 L700,302" stroke="#6b3fa0" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#mReg)"/>
  <text class="tiny" x="712" y="258" fill="#6b3fa0">registry, published through PipelineContext</text>

  <!-- ============ BAND 2: CONSTRUCT ============ -->
  <rect x="28" y="272" width="1184" height="146" rx="8" fill="#eef4fb" stroke="#c3d8ec"/>
  <circle cx="46" cy="294" r="11" fill="#1f6fb2"/>
  <text class="num" x="46" y="298" text-anchor="middle">2</text>
  <text class="band" x="66" y="298" fill="#1f6fb2">CONSTRUCT</text>
  <text class="small" x="160" y="298">receiver, once per request</text>

  <rect x="45" y="308" width="292" height="98" rx="6" fill="#ffffff" stroke="#9dc2e0"/>
  <text class="stage" x="57" y="326">request-scoped material</text>
  <text class="mono" x="57" y="346">x-tenant-id: acme</text>
  <text class="mono" x="57" y="362">x-project-id: p-42</text>
  <text class="monot" x="57" y="378">authorization: ...</text>
  <text class="tiny" x="180" y="378">dropped: no token declares it</text>
  <text class="monot" x="57" y="394">peer 10.1.2.3, generic keys, imported keys</text>

  <path d="M337,357 L361,357" stroke="#2d3748" stroke-width="1.6" marker-end="url(#mFlow)"/>

  <rect x="367" y="308" width="336" height="98" rx="6" fill="#ffffff" stroke="#9dc2e0"/>
  <text class="stage" x="379" y="326">resolve</text>
  <text class="mono" x="379" y="346">one pass over the headers</text>
  <text class="mono" x="379" y="362">clear key_mask bits as extractors hit</text>
  <text class="mono" x="379" y="378">mask == 0  -&gt;  token resolved (all or nothing)</text>
  <text class="mono" x="379" y="394">value -&gt; Symbol by exact dictionary lookup</text>

  <path d="M703,357 L727,357" stroke="#2d3748" stroke-width="1.6" marker-end="url(#mFlow)"/>

  <rect x="733" y="308" width="462" height="98" rx="6" fill="#ffffff" stroke="#9dc2e0"/>
  <text class="stage" x="745" y="326">pack</text>
  <text class="mono" x="745" y="346">one symbol word per bound (token, signature) pair</text>
  <text class="mono" x="745" y="362">retained values appended to the blob by slot</text>
  <text class="mono" x="745" y="378">scratch buffer reused: steady state allocates nothing</text>
  <text class="ital" x="745" y="396">no token resolved -&gt; no context at all, and the feature costs one branch</text>

  <path d="M964,406 L964,436" stroke="#2d3748" stroke-width="1.8" marker-end="url(#mFlow)"/>

  <!-- ============ THE PACKED CONTEXT ============ -->
  <rect x="28" y="436" width="1184" height="114" rx="8" fill="#ffffff" stroke="#2f4b66" stroke-width="1.8"/>
  <text class="stage" x="46" y="458">The packed request context</text>
  <text class="small" x="230" y="458">one allocation carried with the request data -- nothing in it is self-describing</text>
  <text class="ital" x="46" y="476">A value is addressed by the slot its key owns, so no name, key id or descriptor travels with a request. The layout is positional: equal tenant values give byte-equal contexts, whatever order the headers arrived in.</text>

  <rect x="60" y="486" width="230" height="56" fill="#dbe7f3" stroke="#7fa6c6"/>
  <rect x="290" y="486" width="150" height="56" fill="#cfe0f0" stroke="#7fa6c6"/>
  <rect x="440" y="486" width="200" height="56" fill="#bcd6ec" stroke="#7fa6c6"/>
  <rect x="640" y="486" width="180" height="56" fill="#e3edf6" stroke="#7fa6c6"/>
  <rect x="820" y="486" width="220" height="56" fill="#ffe9c9" stroke="#d99a3c" stroke-width="1.6"/>
  <rect x="1040" y="486" width="140" height="56" fill="#eef2f6" stroke="#7fa6c6"/>

  <text class="monob" x="175" y="510" text-anchor="middle">n_fp | n_slots | epoch | bag_len</text>
  <text class="monot" x="175" y="528" text-anchor="middle">2 words, the only fixed offsets</text>
  <text class="monob" x="365" y="510" text-anchor="middle">resolved: 64 bits</text>
  <text class="monot" x="365" y="528" text-anchor="middle">1 bit per declared token</text>
  <text class="monob" x="540" y="510" text-anchor="middle">packed symbols</text>
  <text class="monot" x="540" y="528" text-anchor="middle">n_fp words, one per pair</text>
  <text class="monob" x="730" y="510" text-anchor="middle">offset[slot]: u32</text>
  <text class="monot" x="730" y="528" text-anchor="middle">dense, EMPTY = absent</text>
  <text class="monob" x="930" y="510" text-anchor="middle">bag: tagged KeyValue run</text>
  <text class="monot" x="930" y="528" text-anchor="middle">bag_len bytes, copied whole</text>
  <text class="monob" x="1110" y="510" text-anchor="middle">value-only</text>
  <text class="monot" x="1110" y="528" text-anchor="middle">no names</text>

  <!-- ============ BAND 3: CONSUME ============ -->
  <path d="M500,554 L156,632" stroke="#b25f19" stroke-width="1.4" fill="none" marker-end="url(#mRead)"/>
  <path d="M575,554 L386,632" stroke="#b25f19" stroke-width="1.4" fill="none" marker-end="url(#mRead)"/>
  <path d="M700,554 L614,632" stroke="#b25f19" stroke-width="1.4" fill="none" marker-end="url(#mRead)"/>
  <path d="M770,554 L836,632" stroke="#b25f19" stroke-width="1.4" fill="none" marker-end="url(#mRead)"/>
  <path d="M940,554 L1066,632" stroke="#b25f19" stroke-width="1.4" fill="none" marker-end="url(#mRead)"/>

  <rect x="28" y="638" width="1184" height="196" rx="8" fill="#fdf3ec" stroke="#f0d3bd"/>
  <circle cx="46" cy="660" r="11" fill="#b25f19"/>
  <text class="num" x="46" y="664" text-anchor="middle">3</text>
  <text class="band" x="66" y="664" fill="#b25f19">CONSUME</text>
  <text class="small" x="152" y="664">every consumer probes the same context with the same condition vocabulary -- adding a behavior adds a consumer, not a matcher</text>

  <rect x="45" y="676" width="210" height="142" rx="6" fill="#ffffff" stroke="#e0b48a"/>
  <text class="stage" x="57" y="696">processor:tenant_router</text>
  <text class="mono" x="57" y="716">1 bit test</text>
  <text class="mono" x="57" y="732">+ 1 probe per pair</text>
  <text class="mono" x="57" y="748">-&gt; output port</text>
  <text class="tiny" x="57" y="770">Cost is independent of route</text>
  <text class="tiny" x="57" y="784">count, entries per route and</text>
  <text class="tiny" x="57" y="798">batch size. No telemetry is</text>
  <text class="tiny" x="57" y="812">decoded to decide.</text>

  <rect x="275" y="676" width="210" height="142" rx="6" fill="#ffffff" stroke="#e0b48a"/>
  <text class="stage" x="287" y="696">processor:batch</text>
  <text class="mono" x="287" y="716">condition</text>
  <text class="mono" x="287" y="732">-&gt; partition</text>
  <text class="tiny" x="287" y="754">One batch never mixes</text>
  <text class="tiny" x="287" y="768">tenants, so retained values</text>
  <text class="tiny" x="287" y="782">survive the merge and the</text>
  <text class="tiny" x="287" y="796">partition name is stable</text>
  <text class="tiny" x="287" y="810">across producers.</text>

  <rect x="505" y="676" width="210" height="142" rx="6" fill="#ffffff" stroke="#e0b48a"/>
  <text class="stage" x="517" y="696">exporter:otlp_grpc</text>
  <text class="mono" x="517" y="716">slot value</text>
  <text class="mono" x="517" y="732">-&gt; x-acme-customer</text>
  <text class="tiny" x="517" y="754">The wire name belongs to</text>
  <text class="tiny" x="517" y="768">the emitting node, not the</text>
  <text class="tiny" x="517" y="782">token. Static config wins</text>
  <text class="tiny" x="517" y="796">collisions, so tenant data</text>
  <text class="tiny" x="517" y="810">cannot shadow a credential.</text>

  <rect x="735" y="676" width="210" height="142" rx="6" fill="#ffffff" stroke="#e0b48a"/>
  <text class="stage" x="747" y="696">topic / kafka boundary</text>
  <text class="mono" x="747" y="716">export_keys</text>
  <text class="mono" x="747" y="732">-&gt; import_keys</text>
  <text class="tiny" x="747" y="754">Each side names what it</text>
  <text class="tiny" x="747" y="768">admits; unnamed keys are</text>
  <text class="tiny" x="747" y="782">dropped. The far side re-</text>
  <text class="tiny" x="747" y="796">resolves its own tokens, so</text>
  <text class="tiny" x="747" y="810">a hop is not a hole.</text>

  <rect x="965" y="676" width="210" height="142" rx="6" fill="#ffffff" stroke="#e0b48a"/>
  <text class="stage" x="977" y="696">attributes</text>
  <text class="mono" x="977" y="716">copy bag run</text>
  <text class="mono" x="977" y="732">-&gt; Span.attributes</text>
  <text class="tiny" x="977" y="754">The bag is tagged with the</text>
  <text class="tiny" x="977" y="768">consumer's own field number</text>
  <text class="tiny" x="977" y="782">at compile time, so tenant</text>
  <text class="tiny" x="977" y="796">identity becomes attributes</text>
  <text class="tiny" x="977" y="810">by copying bytes.</text>

  <!-- ============ LEGEND ============ -->
  <rect x="28" y="848" width="16" height="12" fill="#f5f2fa" stroke="#8a5cc0"/>
  <text class="small" x="52" y="858">compiled once: names, symbols and layouts live only here</text>
  <rect x="420" y="848" width="16" height="12" fill="#bcd6ec" stroke="#7fa6c6"/>
  <text class="small" x="444" y="858">per request: positional bytes, no names</text>
  <rect x="740" y="848" width="16" height="12" fill="#ffe9c9" stroke="#d99a3c"/>
  <text class="small" x="764" y="858">bag: the one place a key name travels, because a consumer asked for it</text>
</svg>
