[package]
name = "otel-arrow-dfe-contrib-extensions"
description = "OTAP Contrib extensions"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates
otel-arrow-dfe-config = { workspace = true }
otel-arrow-dfe-contrib-nodes = { workspace = true, optional = true }
otel-arrow-dfe-engine = { workspace = true }
otel-arrow-dfe-otap = { workspace = true }
otel-arrow-dfe-telemetry = { workspace = true }
otel-arrow-dfe-telemetry-macros = { workspace = true }
otel-arrow-dfe-sparkplug = { workspace = true, optional = true }

async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http = { workspace = true, optional = true }
linkme.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
ntex-mqtt = { workspace = true, optional = true }
ntex-bytes.workspace = true
ntex-net = { workspace = true, optional = true }
ntex-service = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true, features = ["reqwest"] }
azure_identity = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["form"] }
ring = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ms-mqtt-client = { workspace = true, optional = true }

[features]
# Umbrella feature enabling all contrib extensions.
contrib-extensions = ["azure-identity-auth-extension", "k8s-service-account-token-auth-extension", "oauth2-client-auth-extension", "mqtt-client-extension", "mqtt-server-extension", "mqtt-sparkplug-extension"]
# Azure Identity authentication extension (BearerTokenProvider capability).
azure-identity-auth-extension = ["dep:azure_core", "dep:azure_identity", "dep:humantime-serde", "dep:rand"]
# Kubernetes service-account-token authorizer extension (BearerTokenAuthorizer
# capability) validating tokens via the Kubernetes TokenReview API.
k8s-service-account-token-auth-extension = ["dep:kube", "dep:k8s-openapi", "dep:humantime-serde", "dep:sha2"]
# OAuth 2.0 Client Auth extension (BearerTokenProvider capability).
oauth2-client-auth-extension = ["dep:oauth2", "dep:reqwest", "dep:http", "dep:jsonwebtoken", "dep:humantime-serde", "dep:rand", "dep:secrecy"]
# MQTT Client extension (MqttIngress/MqttEgress capabilities), backed by
# `ms-mqtt-client`. Plaintext-only in this milestone: `ms-mqtt-client`
# currently pulls in `openssl`/`tokio-openssl` unconditionally (see
# https://github.com/microsoft/rust-mqtt-client issue tracking a pluggable
# TLS/crypto backend), so no `crypto-*` feature is wired here yet.
mqtt-client-extension = ["dep:ms-mqtt-client", "dep:otel-arrow-dfe-contrib-nodes", "otel-arrow-dfe-contrib-nodes/mqtt-client-backend", "dep:humantime-serde"]
# MQTT server extension (MqttIngress/MqttEgress capabilities), backed by
# `ntex-mqtt` and driven by the DFE core's own tokio accept loop.
mqtt-server-extension = [
    "dep:ntex-mqtt",
    "dep:ntex-net",
    "dep:ntex-service",
    "dep:humantime-serde",
]
# MQTT Sparkplug extension (MqttIngress/MqttEgress capabilities), backed by
# `ntex-mqtt` plus the engine-free `otel-arrow-dfe-sparkplug` state machine.
mqtt-sparkplug-extension = [
    "dep:ntex-mqtt",
    "dep:ntex-net",
    "dep:ntex-service",
    "dep:otel-arrow-dfe-sparkplug",
]

# JWT assertion-signing backend for the OAuth 2.0 client auth extension. These
# mirror the workspace `crypto-*` features so a build signs assertions with the
# same library it uses for TLS. See `oauth2_client_auth::jwt_crypto`.
crypto-ring = ["dep:ring"]
crypto-aws-lc = ["jsonwebtoken?/aws_lc_rs"]
crypto-openssl = ["dep:openssl"]

[dev-dependencies]
flume = { workspace = true }
otel-arrow-dfe-contrib-nodes = { workspace = true, features = ["mqtt-client-backend"] }
otel-arrow-dfe-engine = { workspace = true, features = ["test-utils"] }
otel-arrow-dfe-otap = { workspace = true, features = ["crypto-ring"] }
otel-arrow-dfe-test-tls-certs = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
# Test fallback for the JWT signing backend when no `crypto-*` feature is
# selected, so the suite runs without committing the library to a backend.
ring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }
wiremock = { workspace = true }
